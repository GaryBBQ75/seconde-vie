services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://secondevie:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/secondevie
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL requis}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requis}
      ADMIN_NAME: ${ADMIN_NAME:-Responsable}
      ORGANISATION_NAME: ${ORGANISATION_NAME:-Ma ressourcerie}
      SECURE_COOKIES: "true"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secondevie
      POSTGRES_USER: secondevie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "secondevie", "-d", "secondevie"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  postgres_data:
